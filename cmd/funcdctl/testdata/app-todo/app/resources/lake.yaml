catalogs:
  - name: ${{ app.name + "-lake" }}
    bindings:
      blob:
        - alias: events
          bucket: ${{ app.name + "-files" }}
          prefix: events
        - alias: lake
          bucket: ${{ app.name + "-files" }}
          prefix: lake
    catalog:
      bucket: ${{ app.name + "-files" }}
      prefix: lake
