buckets:
  - name: ${{ app.name + "-web" }}
    prefixes:
      - name: web
sites:
  - name: ${{ app.name + "-web" }}
    image: ${{ images.web }}
    bindings:
      blob:
        - bucket: ${{ app.name + "-web" }}
          prefix: web
    spa: true
    ingress:
      host: ${{ values.host }}
      auth:
        mode: open
